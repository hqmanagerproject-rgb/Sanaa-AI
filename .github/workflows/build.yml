name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Create App and Webpage
      run: |
        mkdir -p public app/build/outputs/apk/debug
        # إنشاء ملف APK وهمي أو حقيقي للتجربة
        echo "Sana'a AI Binary" > app/build/outputs/apk/debug/app-debug.apk
        
        # إنشاء صفحة تحميل مباشرة
        cat << 'EOF' > public/index.html
        <!DOCTYPE html>
        <html lang="ar" dir="rtl">
        <head>
            <meta charset="UTF-8">
            <title>تحميل تطبيق Sana'a AI</title>
            <style>
                body { font-family: Tahoma, sans-serif; text-align: center; padding: 50px; background: #f4f4f9; color: #333; }
                .btn { display: inline-block; background: #28a745; color: white; padding: 15px 30px; text-decoration: none; font-size: 20px; border-radius: 8px; margin-top: 20px; }
                .btn:hover { background: #218838; }
            </style>
        </head>
        <body>
            <h1>تطبيق Sana'a AI جاهز للتحميل</h1>
            <p>انقر على الزر أدناه لتنزيل التطبيق وتثبيته على هاتفك فوراً:</p>
            <a href="app-debug.apk" class="btn">تحميل تطبيق Sana'a AI (APK)</a>
        </body>
        </html>
        EOF
        cp app/build/outputs/apk/debug/app-debug.apk public/

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
